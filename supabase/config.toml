project_id = "prospectospignus"

[functions.cotizacion-dolar]
# El manejador verifica getUser y perfil activo antes de acceder a la cotización.
verify_jwt = false

[auth]
enable_signup = false
minimum_password_length = 10

[functions.crear-usuario]
# getUser(token) verifica la sesión en Auth antes de usar cualquier privilegio.
# Esta configuración permite las claves publishable modernas; no elimina la validación del manejador.
verify_jwt = false
